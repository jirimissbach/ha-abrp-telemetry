[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-abrp-telemetry"
version = "0.1.1"
description = "Generic Home Assistant entity telemetry bridge to ABRP"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{name = "Jiri Missbach"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
  "homeassistant>=2026.9.0,<2026.10.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "pytest-homeassistant-custom-component>=0.13.300",
  "ruff>=0.12.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=custom_components.abrp_telemetry --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
fail_under = 85

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "S", "UP"]
ignore = [
  "COM812",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"custom_components/abrp_telemetry/const.py" = ["S105"]
"tests/*" = ["S101"]
